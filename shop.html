<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Aliya Jewellery</title>
  <meta name="description" content="Browse gold and diamond jewellery by Aliya — rings, necklaces, earrings, bracelets and more." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">

  <div id="header"></div>

  <section class="page-banner">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> / Shop</div>
      <h1>The Collection</h1>
      <p>Filter by metal, category and price — every piece BIS hallmarked or IGI certified.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filters">
        <div class="chip-group" id="catChips">
          <button class="chip active" data-cat="all">All</button>
          <button class="chip" data-cat="gold">Gold</button>
          <button class="chip" data-cat="diamond">Diamond</button>
          <button class="chip" data-cat="Ring">Rings</button>
          <button class="chip" data-cat="Necklace">Necklaces</button>
          <button class="chip" data-cat="Earrings">Earrings</button>
          <button class="chip" data-cat="Bracelet">Bracelets</button>
        </div>
        <div class="chip-group">
          <select id="priceFilter" aria-label="Price range">
            <option value="all">Any price</option>
            <option value="0-50000">Under ₹50,000</option>
            <option value="50000-150000">₹50k – ₹1.5L</option>
            <option value="150000-999999999">Above ₹1.5L</option>
          </select>
          <select id="sortBy" aria-label="Sort">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="discount">Biggest Discount</option>
          </select>
        </div>
      </div>

      <p class="result-count" id="resultCount"></p>
      <div class="product-grid" id="shopGrid"></div>
      <div class="empty-state card" id="shopEmpty" hidden>
        <div class="big">🔍</div>
        <h3>No pieces match those filters</h3>
        <p>Try widening your price range or choosing another category.</p>
        <button class="btn btn-gold" id="resetFilters">Reset Filters</button>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
